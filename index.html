<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
  <title>Document</title>
  <style>
    *{
      box-sizing : border-box;
    }
    body {
      min-height : 100vh;
      display : flex;
      justify-content : center;
      align-items : center;
      font-family : 'Outfit', sans-serif;
    }
    .title { 
      font-weight : 700;
    }
    .greyParent{
      width : 95%;
      background-color : hsl(216, 15%, 48%);
      display : flex;
      justify-content : center;
      align-items : center;
      padding :30px;

    }
    .whiteParent {
      background-color : hsl(212, 45%, 89%);
      padding: 20px;
      border-radius : 10px;
      max-width : 340px;
      
    }
    
    p{
      font-size : 0.9375rem;
      font-weight : 400;
    }
    .qrCode { 
      width : 100%;
      height : auto;
      border-radius : 10px;
    
    }
    
  </style>
</head>
<body>
  
    <div class = "greyParent">
      <div class ="whiteParent">
        <div class ="allThings">
          <img src = "images/image-qr-code.png" class = "qrCode">
          <h2 class = "title">Improve your front-end skills by building 
            projects
          </h2>
        </div>
        <p>Scan the QR code to visit Frontend Mentor and take your coding
          skills to the next level
        </p>
      </div>
  
  </div>
</body>
</html>
